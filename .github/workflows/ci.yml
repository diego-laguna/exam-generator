name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-26.04
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: learn
          POSTGRES_PASSWORD: learn
          POSTGRES_DB: learn_assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learn -d learn_assistant"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-packages
      - run: uv run pyright
      - run: uv run pytest -q
        working-directory: apps/api
      - run: uv run pytest -q
        working-directory: apps/worker

  images:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t exam-api:ci .
      - run: docker build -f apps/worker/Dockerfile -t exam-worker:ci .
      # The API image must stay free of the heavy worker-only dependencies.
      - run: |
          docker run --rm exam-api:ci python -c "
          import importlib.util as u
          heavy = [m for m in ('fastembed', 'onnxruntime', 'pdfminer', 'anthropic') if u.find_spec(m)]
          assert not heavy, heavy"

  terraform:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  js:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      # The committed OpenAPI schema and generated types must match the API.
      - run: uv sync --frozen --package exam-api
      - run: |
          (cd apps/api && uv run python -m scripts.export_openapi)
          pnpm --filter @exam-generator/api-client generate
          git diff --exit-code -- packages/api-client || {
            echo "::error::API contract changed. Run 'just gen-client' and commit the result."; exit 1; }
