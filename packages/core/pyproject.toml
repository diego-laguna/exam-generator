[project]
name = "exam-core"
version = "0.1.0"
description = "Code shared by the API and the worker: settings, database models, storage, queue messages."
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.114",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exam_core"]
