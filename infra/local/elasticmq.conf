# Local stand-in for Amazon SQS (docker compose). Same queue names as Terraform's queue.tf.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  exam-generator-jobs {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "exam-generator-jobs-dlq"
      maxReceiveCount = 3
    }
  }
  exam-generator-jobs-dlq {}
}
