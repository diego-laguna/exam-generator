services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: learn_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn -d learn_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SQS-compatible queue for the worker (API -> queue -> worker). Queue URL:
  # http://localhost:9324/000000000000/exam-generator-jobs
  queue:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "9324:9324"
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  pgdata:
