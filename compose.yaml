services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: learn
      POSTGRES_PASSWORD: learn
      POSTGRES_DB: learn_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learn -d learn_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
