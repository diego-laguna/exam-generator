[project]
name = "exam-generator"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.114",
    "fastapi[standard]>=0.143.2",
    "fastembed>=0.9.0",
    "httpx2>=2.13.1",
    "pdfminer-six>=20260107",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["app", "scripts", "tests"]
exclude = ["migrations", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"
