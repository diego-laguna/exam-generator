[project]
name = "exam-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "exam-core",
    "fastapi[standard]>=0.143.2",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "reportlab>=5.0.1",
]

[tool.uv.sources]
exam-core = { workspace = true }

[dependency-groups]
dev = [
    "boto3-stubs[s3,sqs]>=1.43.114",
    "pdfminer-six>=20260107",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
